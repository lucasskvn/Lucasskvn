  <style>
    @keyframes portrait-reveal {
      from { clip-path: inset(0 0 100% 0) fill-box; }
      to { clip-path: inset(0) fill-box; }
    }

    @keyframes text-reveal {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: no-preference) {
      .portrait {
        animation: portrait-reveal 480ms steps(14, end) 80ms 1 backwards;
      }

      .reveal {
        animation: text-reveal 280ms ease-out var(--delay) 1 backwards;
      }
    }
  </style>

